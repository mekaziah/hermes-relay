name: Build GaryAI APK

# Manual-only build used for the GaryAI rebrand sideload APK.
# Debug APK signed with an auto-generated CI debug keystore (owner's device only).
on:
  workflow_dispatch:
  push:
    branches: [garyai]

env:
  # ubuntu-latest runners ship a preinstalled SDK; using it avoids the
  # sdkmanager 'Failed to find package tools' failure in setup-android.
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Show SDK
        run: ls "$ANDROID_HOME/platforms" && ls "$ANDROID_HOME/build-tools" | tail -2

      - name: Build sideload debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleSideloadDebug --no-daemon --stacktrace

      - name: Locate APK
        run: find app/build/outputs/apk -name '*.apk' -print -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: garyai-sideload-debug
          path: app/build/outputs/apk/sideload/debug/*.apk
          retention-days: 7
