name: Build GaryAI APK

# Manual-only build used for the GaryAI rebrand sideload APK.
# Produces an unsigned-by-CI key debug APK (auto debug keystore) — do NOT use
# for distribution; this is for installing on the owner's own device.
on:
  workflow_dispatch:
  push:
    branches: [garyai]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build sideload debug APK
        run: ./gradlew assembleSideloadDebug --no-daemon --stacktrace

      - name: Locate APK
        run: |
          find app/build/outputs/apk -name '*.apk' -print -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: garyai-sideload-debug
          path: app/build/outputs/apk/sideload/debug/*.apk
          retention-days: 7
